name: Release

# Publishes a GitHub release when a new version lands on main.
# Runs after Validate passes on a push to main; does nothing if the
# version in manifest.json already has a tag.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version custom_components/powerbot_s/manifest.json)
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create release if the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to do"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
